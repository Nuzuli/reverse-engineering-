name: Python Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Check lockfile is in sync
        run: |
          while IFS= read -r line; do
            case "$line" in ""|"#"*|"-r "*) continue ;; esac
            grep -qixF "$line" requirements-lock.txt || {
              echo "requirements-lock.txt is missing or out of date: $line"
              echo "Run the 'Update lockfile' workflow to regenerate it."
              exit 1
            }
          done < requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt

      - name: Audit dependencies
        run: |
          pip install pip-audit
          pip-audit --no-deps -r requirements-lock.txt

      - name: Lint with ruff
        run: ruff check src tests

      - name: Type check with mypy
        run: mypy src

      - name: Run unit tests with coverage
        env:
          PYTHONPATH: .
        run: python -m pytest tests/ -v --cov=src --cov-report=term --cov-fail-under=80